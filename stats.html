<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#c9d4e6">
  <title>访问统计 · PORTFOLIO</title>
  <!-- 只给自己看的统计页：网站里没有任何入口链到这里。数字来自 app.js 里的两个计数器（STATS），这里的地址要和那边一致 -->
  <style>
    :root{--ink:#141c45;--soft:#1f2a4d;--muted:#56627f;--serif:Didot,"Bodoni 72","Bodoni MT","Times New Roman",serif;--glow:0 0 10px #ffffffd9,0 0 22px #ffffff8c}
    *{box-sizing:border-box}
    html{background:#cdd7e8}
    body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:#cdd7e8 url(frames/0360.webp) center/cover fixed no-repeat}
    main{width:min(100%,920px);container-type:inline-size}
    .label,.rule{display:flex;justify-content:space-between;gap:16px;font-weight:500;color:var(--soft);text-shadow:var(--glow)}
    .label{margin:0 0 14px;font-size:10px;letter-spacing:2px}
    h1{margin:0;font-family:var(--serif);font-weight:400;font-size:17.2cqw;line-height:.82;letter-spacing:-.055em;text-align:center;padding-right:.05em;background:linear-gradient(110deg,#0f1747 8%,#23336e 38%,#5d6f9c 55%,#1a1f52 76%,#7a1d63 98%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .rule{margin-top:22px;padding-top:12px;border-top:1px solid #23305a55;font-size:11px;letter-spacing:1.4px}
    .rule span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
    .cards{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{min-height:clamp(200px,34vh,300px);display:flex;flex-direction:column;padding:17px 19px 15px;border-radius:20px;background:linear-gradient(142deg,#ffffffe8,#f6f9ffb0);border:1px solid #fff;box-shadow:0 14px 36px -16px #3a4a6e55,0 1px 0 #ffffffd4 inset;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
    .top,.bottom{display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:500;letter-spacing:1.6px;color:var(--muted)}
    .top i{font-style:normal}
    .card em{flex:1;display:flex;align-items:center;white-space:nowrap;font-family:var(--serif);font-style:normal;font-size:clamp(64px,15cqw,132px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums lining-nums;background:linear-gradient(135deg,#8f9fb6,#4b5b7c 48%,#b8914a);-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .25s}
    .card.busy em{opacity:.35}
    .card strong{font-weight:500;font-size:clamp(14px,2cqw,19px);letter-spacing:-.02em;margin:0 0 11px}
    .bottom{padding-top:11px;border-top:1px solid #23305a22;letter-spacing:.6px;font-size:11px}
    .bar{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .ratio{margin:0;font-size:12px;letter-spacing:.4px;color:var(--soft);text-shadow:var(--glow);font-variant-numeric:tabular-nums}
    button{font:inherit;font-size:14px;letter-spacing:.5px;height:52px;padding:0 30px;border:0;border-radius:999px;background:#ffffffe6;box-shadow:0 0 0 1px #ffffff80,0 12px 34px #1d26442e;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .25s,transform .3s cubic-bezier(.16,1,.3,1)}
    button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    button:hover{background:#fff;transform:scale(1.04)}
    button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
    button:disabled{opacity:.6;cursor:default;transform:none}
    button:disabled svg{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .note{margin:18px 0 0;font-size:11px;line-height:1.8;letter-spacing:.3px;color:var(--soft);text-shadow:var(--glow)}
    @media (max-width:560px){
      body{align-items:flex-start;padding-left:16px;padding-right:16px}
      .label{font-size:8px;letter-spacing:1.4px}
      .rule{font-size:9px;letter-spacing:.6px;margin-top:16px}
      .cards{grid-template-columns:1fr;gap:12px;margin-top:22px}
      .card{min-height:168px;padding:13px 16px 12px;border-radius:16px}
      .card em{font-size:clamp(56px,22cqw,84px);padding:6px 0}
      .top{font-size:8px;letter-spacing:1.2px}
      .bottom{font-size:10px}
      .bar{margin-top:20px}
      button{height:48px;padding:0 24px}
    }
    @media (prefers-reduced-motion:reduce){button,.card em{transition:none}button:disabled svg{animation:none}}
  </style>
</head>
<body>
  <main>
    <p class="label"><span>SITE STATISTICS</span><span>2026</span></p>
    <h1>STATISTICS</h1>
    <div class="rule"><span>访问与下载，只给自己看。</span><span id="state" aria-live="polite">读取中…</span></div>
    <ol class="cards">
      <li class="card busy"><span class="top"><span>VISITS</span><i aria-hidden="true">01</i></span><em id="visits">—</em><strong>访问量</strong><span class="bottom"><span>打开网站的次数</span><span>同一窗口内刷新只算一次</span></span></li>
      <li class="card busy"><span class="top"><span>DOWNLOADS</span><i aria-hidden="true">02</i></span><em id="downloads">—</em><strong>下载量</strong><span class="bottom"><span>点击“下载”的次数</span><span>导航、结束页、阅读页三处都算</span></span></li>
    </ol>
    <div class="bar">
      <button id="refresh" disabled><span>刷新</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg></button>
      <p class="ratio" id="ratio"></p>
    </div>
    <p class="note">本机打开和私有预览不计数。计数器连续半年没有新的访问会被清空。</p>
  </main>
  <script>
    const API = 'https://abacus.jasoncameron.dev/get/liyucong-design/';
    const KEYS = ['visits', 'downloads'];
    const btn = document.getElementById('refresh'), state = document.getElementById('state'), ratio = document.getElementById('ratio');
    const cards = [...document.querySelectorAll('.card')];
    // 计数器还没被加过时服务返回 404，就是 0；连不上才算失败
    async function read(key) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
      try {
        const r = await fetch(API + key, { cache: 'no-store', signal: ctl.signal });
        if (r.status === 404) return 0;
        if (!r.ok) throw new Error(r.status);
        return Number((await r.json()).value) || 0;
      } finally { clearTimeout(timer); }
    }
    // 数字太长放不下时按卡片宽度缩小字号
    function fit() {
      KEYS.forEach(k => {
        const el = document.getElementById(k);
        el.style.fontSize = '';
        const w = el.clientWidth, sw = el.scrollWidth;
        if (sw > w + 1) el.style.fontSize = `${(parseFloat(getComputedStyle(el).fontSize) * w / sw * .97).toFixed(1)}px`;
      });
    }
    addEventListener('resize', fit);
    async function load() {
      btn.disabled = true; state.textContent = '读取中…';
      cards.forEach(c => c.classList.add('busy'));
      try {
        const [v, d] = await Promise.all(KEYS.map(read));
        document.getElementById('visits').textContent = v.toLocaleString('zh-CN');
        document.getElementById('downloads').textContent = d.toLocaleString('zh-CN');
        fit();
        ratio.textContent = v > 0 ? `每 100 次访问，约有 ${(d / v * 100).toFixed(d / v < .1 ? 1 : 0)} 次下载` : '';
        state.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch {
        state.textContent = '暂时连不上计数服务，请稍后再刷新';
      }
      cards.forEach(c => c.classList.remove('busy'));
      btn.disabled = false;
    }
    btn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
